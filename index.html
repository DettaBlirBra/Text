RENSA 🧹
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
function resize() {
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();
const partiklar = [];
const mus = { x: null, y: null, aktiv: false };
let aktuelltLäge = 0;
const lägenInfo = [
"KVANT-GRAVITATION 🌌",
"SUPERNOVA-EXPLOSION 🎆",
"KOSMISK CYKLON 🌀",
"MATRIX-REGN ⚡"
];
function uppdateraMusPosition(e) {
let clientX, clientY;
if (e.touches && e.touches.length > 0) {
clientX = e.touches[0].clientX;
clientY = e.touches[0].clientY;
} else {
clientX = e.clientX;
clientY = e.clientY;
}
mus.x = clientX;
mus.y = clientY;
mus.aktiv = true;
skapaPartiklar(4);
}
window.addEventListener('mousemove', uppdateraMusPosition);
window.addEventListener('touchmove', function(e) {
e.preventDefault();
uppdateraMusPosition(e);
}, { passive: false });
window.addEventListener('mousedown', () => skapaPartiklar(40));
window.addEventListener('touchstart', function(e) {
uppdateraMusPosition(e);
skapaPartiklar(40);
});
window.addEventListener('touchend', () => mus.aktiv = false);
window.addEventListener('mouseup', () => mus.aktiv = false);
class Partikel {
constructor(x, y) {
this.x = x;
this.y = y;
const vinkel = Math.random() * Math.PI * 2;
const fart = Math.random() * 8 + 2;
this.vx = Math.cos(vinkel) * fart;
this.vy = Math.sin(vinkel) * fart;
this.storlek = Math.random() * 4 + 1.5;
this.hue = Math.random() * 60 + 180;
this.liv = 1;
this.blekning = Math.random() * 0.008 + 0.004;
}
uppdatera() {
if (mus.aktiv && mus.x !== null) {
const dx = mus.x - this.x;
const dy = mus.y - this.y;
const distans = Math.sqrt(dx * dx + dy * dy) || 1;
if (aktuelltLäge === 0) {
this.vx += (dx / distans) * 0.5;
this.vy += (dy / distans) * 0.5;
} else if (aktuelltLäge === 2) {
this.vx += (dx / distans) * 0.4 + (dy / distans) * 0.4;
this.vy += (dy / distans) * 0.4 - (dx / distans) * 0.4;
} else if (aktuelltLäge === 3) {
this.vy += 0.2;
if(distans < 150) {
this.vx -= (dx / distans) * 0.8;
}
}
} else if (aktuelltLäge === 3) {
this.vy += 0.15;
}
this.vx *= 0.97;
this.vy *= 0.97;
this.x += this.vx;
this.y += this.vy;
if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
this.liv -= this.blekning;
this.hue += 1.5;
}
rita() {
ctx.fillStyle = hsl(${this.hue}, 100%, 65%, ${this.liv});
ctx.shadowBlur = 10;
ctx.shadowColor = hsl(${this.hue}, 100%, 60%);
ctx.beginPath();
ctx.arc(this.x, this.y, this.storlek, 0, Math.PI * 2);
ctx.fill();
}
}
function skapaPartiklar(antal) {
if (mus.x === null || mus.y === null) return;
for (let i = 0; i < antal; i++) {
partiklar.push(new Partikel(mus.x, mus.y));
}
}
function bytLäge(e) {
if(e) e.stopPropagation();
aktuelltLäge = (aktuelltLäge + 1) % lägenInfo.length;
document.getElementById('modeDisplay').innerText = "LÄGE: " + lägenInfo[aktuelltLäge];
}
function rensa(e) {
if(e) e.stopPropagation();
partiklar.length = 0;
}
function animera() {
ctx.fillStyle = 'rgba(2, 2, 8, 0.15)';
ctx.fillRect(0, 0, canvas.width, canvas.height);
ctx.shadowBlur = 0;
for (let i = partiklar.length - 1; i >= 0; i--) {
partiklar[i].uppdatera();
partiklar[i].rita();
if (partiklar[i].liv <= 0) {
partiklar.splice(i, 1);
}
}
requestAnimationFrame(animera);
}
animera();
